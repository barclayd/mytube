name: MyTube
options:
  bundleIdPrefix: com.barclayd
  deploymentTarget:
    iOS: '27.0'
packages:
  YouTubeKit:
    path: Vendor/YouTubeKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: MyTube
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  MyTube:
    type: application
    platform: iOS
    info:
      path: MyTube/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MyTubeRemoteURL: $(MYTUBE_REMOTE_URL)
        MyTubeRemoteToken: $(MYTUBE_REMOTE_TOKEN)
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.barclayd.MyTube.downloads.*]
    configFiles:
      Debug: MyTube/Build.xcconfig
      Release: MyTube/Build.xcconfig
    sources:
      - path: MyTube
        excludes: [PrivateRemote.xcconfig]
    dependencies:
      - package: YouTubeKit
  MyTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources: MyTubeTests
    dependencies:
      - target: MyTube
schemes:
  MyTube:
    build:
      targets:
        MyTube: all
    test:
      targets:
        - MyTubeTests
